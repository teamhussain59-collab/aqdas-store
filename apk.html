<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MR AQDAS — Apps</title>
<meta name="description" content="MR AQDAS ki APK apps aur web tools — free download.">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>:root{--a:#ff0000;--bg:#0b0b0f;--fg:#fff;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--mut:rgba(255,255,255,.65)}
body.light{--bg:#f6f6f8;--fg:#111;--card:#fff;--line:rgba(0,0,0,.1);--mut:rgba(0,0,0,.6)}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;padding:22px 16px 60px}
a{color:inherit;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:0 auto 18px}
.brand{font-family:Cinzel,serif;font-weight:800;letter-spacing:4px;font-size:18px}.brand b{color:var(--a)}.home{font-size:14px;border:1px solid var(--line);padding:8px 14px;border-radius:30px}
h1{font-family:Cinzel,serif;text-align:center;letter-spacing:3px;margin:8px 0 4px;font-size:28px}h1 b{color:var(--a)}.sub{text-align:center;color:var(--mut);margin:0 0 18px;font-size:14px}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:22px}.tabs a{padding:10px 22px;border-radius:30px;border:1px solid var(--line);font-weight:700}.tabs a.on{background:var(--a);color:#fff;border-color:var(--a)}
.search{display:block;max-width:420px;margin:0 auto 20px;width:100%;padding:12px 16px;border-radius:30px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px}
.grid{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 24px rgba(0,0,0,.08);transition:transform .2s}.c:hover{transform:translateY(-4px)}
.im{aspect-ratio:16/9;background:linear-gradient(135deg,var(--a),#222);display:grid;place-items:center;font-size:30px;overflow:hidden}.im img{width:100%;height:100%;object-fit:cover}
.b{padding:9px;display:flex;flex-direction:column;gap:4px;flex:1}.b h3{margin:0;font-size:14px;line-height:1.25}.meta{display:flex;gap:6px;flex-wrap:wrap}.meta span{font-size:10px;padding:2px 7px;border-radius:20px;background:color-mix(in srgb,var(--a) 15%,transparent);color:var(--a);font-weight:700}.meta span.sz{font-size:11px;font-weight:400;background:none;padding:0 2px;color:var(--mut)}
.b p{margin:0;color:var(--mut);font-size:11.5px;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.btn{margin-top:6px;text-align:center;padding:8px;border-radius:10px;font-size:13px;background:var(--a);color:#fff;font-weight:800}
.empty{text-align:center;color:var(--mut);grid-column:1/-1;padding:40px}</style></head><body>
<div class="top"><a class="brand" href="/">MR <b>AQDAS</b></a><a class="home" href="/">🏠 Store</a></div>
<h1 id="ttl"></h1><p class="sub" id="sub"></p>
<div class="tabs"><a href="/apk" id="tA">📱 APK</a><a href="/web" id="tW">🌐 WEB</a></div>
<input class="search" id="q" placeholder="🔍 Search...">
<div class="grid" id="g"><p class="empty">Load ho raha hai...</p></div>
<script type="module">
import {loadSite} from './fb.js';
const $=i=>document.getElementById(i);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u||'')?u:'#';
const T=/\/web/i.test(location.pathname)||new URLSearchParams(location.search).get('t')==='web'?'web':'apk';
$(T==='web'?'tW':'tA').classList.add('on');
$('ttl').innerHTML=T==='web'?'🌐 WEB <b>TOOLS</b>':'📱 APK <b>APPS</b>';$('sub').textContent=T==='web'?'Websites aur online tools — ek click mein kholo':'Android apps — free download';
document.title='MR AQDAS — '+(T==='web'?'Web Tools':'APK Apps');
let d={};try{d=await loadSite()}catch(e){}
document.documentElement.style.setProperty('--a',d.accent||'#ff0000');if(d.theme==='light')document.body.classList.add('light');
const all=(Array.isArray(d.apps)?d.apps:[]).filter(a=>a&&a.on!=='off'&&(a.type||'apk').toLowerCase()===T);
function draw(){const s=$('q').value.trim().toLowerCase();const L=all.filter(a=>!s||(a.name+' '+(a.desc||'')).toLowerCase().includes(s));
$('g').innerHTML=L.length?L.map(a=>`<div class="c"><div class="im">${a.image?`<img src="${esc(a.image)}" alt="${esc(a.name)}" loading="lazy">`:(T==='web'?'🌐':'📱')}</div><div class="b"><h3>${esc(a.name)}</h3><div class="meta">${a.version?`<span>v${esc(String(a.version).replace(/^v/i,''))}</span>`:''}${a.size?`<span class="sz">${esc(a.size)}</span>`:''}${a.price?`<span>${esc(a.price)}</span>`:'<span>FREE</span>'}</div>${a.desc?`<p>${esc(a.desc)}</p>`:'<p></p>'}<a class="btn" href="${esc(safe(a.url))}" target="_blank" rel="noopener">${esc(a.btn||(T==='web'?'🌐 Open':'⬇ Download APK'))}</a></div></div>`).join(''):`<p class="empty">Abhi koi ${T==='web'?'web tool':'APK'} nahi. Jald aa raha hai 🔥</p>`}
$('q').oninput=draw;draw();
</script></body></html>

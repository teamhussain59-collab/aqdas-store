<p class="n">Response format: {"status":true,"creator":"MR AQDAS","result":...} — galti par {"status":false,"error":"..."}</p></div><script type="module">

const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u||'')?u:'#';
let d={};try{d=await loadSite()}catch(x){}
const L=(Array.isArray(d.apis)?d.apis:DEF).filter(a=>a&&a.on!=='off');
document.getElementById('L').innerHTML=L.length?L.map(a=>`<div class="c"><h3>${e(a.icon||'⚡')} ${e(a.name)} ${a.paid==='paid'?'<small style="background:#111;color:#ffd400;padding:2px 8px;border-radius:20px;font-size:11px">🔑 PAID</small>':'<small style="background:#1a7f37;color:#fff;padding:2px 8px;border-radius:20px;font-size:11px">FREE</small>'}</h3>${a.paid==='paid'?'<p style="font-size:12px">🔑 Key chahiye: link ke aakhir mein <b>&key=YOUR-KEY</b></p>':''}<code>${e(a.url)}</code>${a.desc?`<p>${e(a.desc)}</p>`:''}<div class="r"><a href="${e(safe(a.url))}" target="_blank" rel="noopener">▶ Try</a><button data-u="${e(a.url)}">📋 Copy</button></div></div>`).join(''):'<p>Abhi koi API nahi.</p>';
document.addEventListener('click',ev=>{const b=ev.target.closest('button[data-u]');if(!b)return;navigator.clipboard.writeText(b.dataset.u).then(()=>{b.textContent='✅ Copied';setTimeout(()=>b.textContent='📋 Copy',1500)})});
</script></body></html>

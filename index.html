-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 45%,transparent 95%);mask-image:linear-gradient(to bottom,#000 0%,#000 45%,transparent 95%);animation:hz 18s ease-in-out infinite alternate}

.brand #nBrand{font-family:Cinzel,serif;letter-spacing:4px;font-weight:700}

</style></head><body>

<script type="module">
import {loadSite} from './fb.js';

{const hb=d.heroBg||d.photo;if(hb&&d.heroBgOn!==false){$('hbg').style.backgroundImage='url("'+String(hb).replace(/["\\)]/g,'')+'")';$('hbg').style.setProperty('--hbo',(d.heroBgOpacity??35)/100);$('hbg').style.setProperty('--hbb',(d.heroBgBlur??0)+'px')}}

const prods=d.products||[],cats=d.categories||[];
$('cats').innerHTML=cats.map((c,i)=>`<div class="cat rv" data-c="${i}"><div class="ci">${c.image?`<img src="${esc(c.image)}" alt="">`:esc(c.icon||'📦')}</div>${esc(c.name)}<small>${prods.filter(p=>p.cat===c.name).length} items</small></div>`).join('');
const loose=prods.filter(p=>!p.cat||!cats.some(c=>c.name===p.cat));$('grid').innerHTML=loose.map(card).join('');
if(!cats.length&&!prods.length)$('cats').innerHTML='<p class="empty">Jald aa raha hai…</p>';
function openCat(i,push=true){const c=cats[i];if(!c)return;$('vtitle').textContent=c.name;const items=prods.filter(p=>p.cat===c.name);
 $('vgrid').innerHTML=items.length?items.map(card).join(''):'<p class="empty">Is category mein abhi kuch nahi</p>';$('view').classList.add('open');$('view').scrollTop=0;document.body.style.overflow='hidden';if(push)history.pushState({c:i},'','#'+encodeURIComponent(c.name))}
function closeCat(){$('view').classList.remove('open');document.body.style.overflow=''}
$('cats').onclick=e=>{const t=e.target.closest('.cat');if(t)openCat(+t.dataset.c)};

addEventListener('popstate',e=>{if(e.state&&e.state.c!=null)openCat(e.state.c,false);else closeCat()});
{const h=decodeURIComponent(location.hash.slice(1));const k=cats.findIndex(c=>c.name===h);if(k>=0){history.replaceState({c:k},'',location.hash);openCat(k,false)}}

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.rv').forEach((el,i)=>{el.style.transitionDelay=(i%4)*90+'ms';io.observe(el)});

// matrix-ish particles
const c=$('bgfx'),x=c.getContext('2d');let W,H,P=[];function rs(){W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:Math.min(70,W/14)},()=>({x:Math.random()*W,y:Math.random()*H,v:.2+Math.random()*.6,s:Math.random()*2+0.5}))}rs();addEventListener('resize',rs);
const ac=getComputedStyle(document.documentElement).getPropertyValue('--a').trim();
(function f(){x.clearRect(0,0,W,H);x.fillStyle=ac;P.forEach(p=>{p.y+=p.v;if(p.y>H){p.y=-5;p.x=Math.random()*W}x.globalAlpha=.35;x.fillRect(p.x,p.y,p.s,p.s*6)});requestAnimationFrame(f)})();
